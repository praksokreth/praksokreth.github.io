<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Shop 🛒</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 10px;
    }

    .cart {
      font-size: 18px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .product {
      background: white;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .product img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 10px;
    }

    .product h3 {
      margin: 10px 0 5px;
    }

    .price {
      color: #e11d48;
      font-size: 18px;
      font-weight: bold;
    }

    button {
      width: 100%;
      border: none;
      background: #16a34a;
      color: white;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      margin-top: 10px;
    }

    button:active {
      transform: scale(0.98);
    }

    .cart-box {
      background: white;
      margin-top: 25px;
      padding: 18px;
      border-radius: 12px;
    }

    @media (max-width: 600px) {
      .products {
        grid-template-columns: repeat(2, 1fr);
      }

      .product img {
        height: 140px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🛍️ My Shop</h1>
    <div class="cart">
      🛒 កន្ត្រក: <span id="cartCount">0</span> មុខ
    </div>
  </header>

  <div class="container">

    <h2>ទំនិញរបស់យើង</h2>

    <div class="products">

      <!-- Product 1 -->
      <div class="product">
        <img src="https://via.placeholder.com/400x300?text=Product+1">
        <h3>អាវយឺត</h3>
        <div class="price">$10</div>
        <button onclick="addToCart('អាវយឺត', 10)">
          ➕ ដាក់ចូលកន្ត្រក
        </button>
      </div>

      <!-- Product 2 -->
      <div class="product">
        <img src="https://via.placeholder.com/400x300?text=Product+2">
        <h3>ស្បែកជើង</h3>
        <div class="price">$25</div>
        <button onclick="addToCart('ស្បែកជើង', 25)">
          ➕ ដាក់ចូលកន្ត្រក
        </button>
      </div>

      <!-- Product 3 -->
      <div class="product">
        <img src="https://via.placeholder.com/400x300?text=Product+3">
        <h3>កាបូប</h3>
        <div class="price">$15</div>
        <button onclick="addToCart('កាបូប', 15)">
          ➕ ដាក់ចូលកន្ត្រក
        </button>
      </div>

      <!-- Product 4 -->
      <div class="product">
        <img src="https://via.placeholder.com/400x300?text=Product+4">
        <h3>នាឡិកា</h3>
        <div class="price">$20</div>
        <button onclick="addToCart('នាឡិកា', 20)">
          ➕ ដាក់ចូលកន្ត្រក
        </button>
      </div>

    </div>

    <div class="cart-box">
      <h2>🛒 កន្ត្រកទំនិញ</h2>

      <div id="cartItems">
        មិនទាន់មានទំនិញទេ
      </div>

      <h3>
        សរុប: $<span id="total">0</span>
      </h3>

      <button onclick="order()">
        📦 បញ្ជាទិញ
      </button>
    </div>

  </div>

  <script>

    let cart = [];
    let total = 0;

    function addToCart(name, price) {

      cart.push({
        name: name,
        price: price
      });

      total = total + price;

      document.getElementById("cartCount").innerText = cart.length;

      showCart();

    }

    function showCart() {

      let box = document.getElementById("cartItems");

      if (cart.length === 0) {
        box.innerText = "មិនទាន់មានទំនិញទេ";
        return;
      }

      box.innerHTML = "";

      cart.forEach(function(item, index) {

        box.innerHTML +=
          "<p>" +
          (index + 1) +
          ". " +
          item.name +
          " - $" +
          item.price +
          "</p>";

      });

      document.getElementById("total").innerText = total;
    }

    function order() {

      if (cart.length === 0) {
        alert("សូមជ្រើសរើសទំនិញជាមុនសិន 🛒");
        return;
      }

      alert(
        "អរគុណសម្រាប់ការបញ្ជាទិញ ❤️\n" +
        "ចំនួនទំនិញ: " + cart.length +
        "\nសរុប: $" + total
      );

    }

  </script>

</body>
</html>
